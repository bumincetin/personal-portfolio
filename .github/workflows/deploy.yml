name: Deploy to Cloudflare Workers

# Replaces the previous GitHub Pages workflow. That one uploaded ./out, which
# stopped being produced once `output: 'export'` was removed so the /api/analyze
# route could run, so it could not have been publishing a working site.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race to the same Worker.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        run: npx tsc --noEmit

      # Runs `next build` and then bundles the Worker into .open-next/.
      # No secrets are needed here: GEMINI_API_KEY is only read at request time
      # by the force-dynamic /api/analyze route, never during the build.
      - name: Build Worker bundle
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
